name: Generate Wikidata Thumbnails

on:
  schedule:
    - cron: '0 0 * * *' # Runs every night at midnight (UTC)
  workflow_dispatch:

# The job commits to main, so overlapping runs would race each other.
concurrency:
  group: generate-thumbnails
  cancel-in-progress: false

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up .NET
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        working-directory: ./wikidata-image-fetcher
        run: dotnet restore
    
      - name: Build the project
        working-directory: ./wikidata-image-fetcher
        run: dotnet build --no-restore --configuration Release
    
      - name: Run the program
        id: run-fetcher
        working-directory: ./wikidata-image-fetcher
        run: dotnet run --no-build --configuration Release

      # Only commit if the previous step succeeded (safety checks passed)
      - name: Commit and push changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -m "Update files" || echo "No changes to commit"
          git push || echo "No changes to push"